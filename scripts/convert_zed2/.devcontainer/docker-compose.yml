#
# Docker Compose for the ZED2-to-COLMAP devcontainer.
# Referenced by devcontainer.json -- not typically invoked directly.
#
# To mount your SVO data directory, set DATA_DIR before opening the container:
#   export DATA_DIR=/path/to/svo/files

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ..:/workspace:cached
      - ${DATA_DIR:-/data}:/data
    command: sleep infinity
